name: Setup-Forschung

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Zeitraum (yfinance)"
        default: "6y"

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python research_setups.py "${{ inputs.period || '6y' }}"
      - name: Ergebnisse speichern
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data/research_setups.md data/research_signals.csv.gz
          git diff --cached --quiet || git commit -m "Setup-Forschung $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -q -X theirs
          git push
