name: Big-Move-Modell

on:
  schedule:
    # So 08:30 UTC: Modell wöchentlich neu trainieren
    - cron: "30 8 * * 0"
  workflow_dispatch:
    inputs:
      period:
        description: "Zeitraum (yfinance)"
        default: "6y"

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python bigmove.py research "${{ inputs.period || '6y' }}"
      - name: Ergebnisse speichern
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data/bigmove_model.pkl data/bigmove_meta.json data/bigmove_report.md
          git diff --cached --quiet || git commit -m "Big-Move-Modell $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -q -X theirs
          git push
