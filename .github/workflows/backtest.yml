name: Backtest + Wahrscheinlichkeitsmodell

on:
  schedule:
    # So 07:30 UTC, nach dem Fundamentaldaten-Lauf
    - cron: "30 7 * * 0"
  workflow_dispatch:
    inputs:
      period:
        description: "Zeitraum (yfinance), z. B. 6y"
        default: "6y"

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Backtest ausführen
        run: python backtest.py "${{ inputs.period || '6y' }}"
      - name: Ergebnisse speichern
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data/prob_model.json data/backtest_report.md data/backtest_signals.csv.gz
          git diff --cached --quiet || git commit -m "Backtest $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -q -X theirs
          git push
